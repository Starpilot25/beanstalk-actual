services:
  - type: web
    name: into-the-beanstalk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Image generation can take 30-90s; raise gunicorn's 30s default timeout.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180
    healthCheckPath: /healthz
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # set the value in the Render dashboard, never in this file
      - key: PYTHON_VERSION
        value: 3.12.7
