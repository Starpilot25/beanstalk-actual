{% extends "base.html" %}
{% block title %}Test checkout · Storybook{% endblock %}
{% block main %}
  <div class="card" style="max-width:460px;margin:20px auto">
    <h2>Pretend checkout</h2>
    <p class="muted">Offline test mode: Stripe isn't connected on this server, so this page stands in for Stripe Checkout. No card is charged.</p>
    <p style="font-size:1.4rem">Amount: <b>{{ amount }}</b></p>
    <form method="post"><input type="hidden" name="session_id" value="{{ sid }}">
      <button type="submit" class="big">Pay {{ amount }}</button> <a class="btn ghost" href="/wallet?cancelled=1">Cancel</a></form>
  </div>
{% endblock %}
